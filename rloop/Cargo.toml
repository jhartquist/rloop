[package]
name = "rloop"
version = "0.1.0"
edition = "2024"

[dependencies]
claude-agent-sdk-rs = "0.6.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures = "0.3"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3.1.1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.9.11"
clap = { version = "4", features = ["derive"] }
strum = { version = "0.27.2", features = ["derive"] }
schemars = "1.2.1"
serde_yaml = "0.9"
