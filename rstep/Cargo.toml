[package]
name = "rstep"
version = "0.1.0"
edition = "2024"

[dependencies]
claude-agent-sdk-rs = "0.6.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures = "0.3"
tempfile = "3"
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
colored = "3.1.1"
